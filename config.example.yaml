# aubergeRP Configuration
# Copy this file to config.yaml. All settings can be changed via the Admin UI.

app:
  # Host and port for the aubergeRP server
  host: "0.0.0.0"
  port: 8123
  # Log level: DEBUG, INFO, WARNING, ERROR
  log_level: "INFO"
  # Data directory (relative to project root or absolute path)
  data_dir: "data"
  # Sentry DSN for error reporting (optional)
  # sentry_dsn: ""
  # bcrypt hash of the admin password; generated on first start if omitted
  # admin_password_hash: ""

# Environment-variable overrides (take precedence over this file):
#   AUBERGE_DATA_DIR             → app.data_dir
#   AUBERGE_HOST                 → app.host
#   AUBERGE_PORT                 → app.port
#   AUBERGE_LOG_LEVEL            → app.log_level
#   AUBERGE_USER_NAME            → user.name
#   AUBERGE_SENTRY_DSN           → app.sentry_dsn
#   AUBERGE_ADMIN_PASSWORD_HASH  → app.admin_password_hash (stable password across restarts)
#   AUBERGE_LLM_API_URL          → auto-provision text connector on startup
#   AUBERGE_LLM_MODEL            → text model name
#   AUBERGE_LLM_CONTEXT_WINDOW   → text model context window in tokens (default: 4096)
#   AUBERGE_LLM_MAX_TOKENS       → max tokens to generate per reply (default: 1024)
#   AUBERGE_IMG_API_URL          → auto-provision image connector on startup
#   AUBERGE_IMG_MODEL            → image model name
#   AUBERGE_DISABLE_ADMIN_AUTH   → set to "1" to bypass admin auth (dev/testing only)

# Active connector IDs. The Admin UI writes these.
# Leave empty on first start.
active_connectors:
  text: ""
  image: ""
  # Optional per-task text models (Admin → Configuration → Advanced settings).
  # Leave empty to use the same model as `text`.
  text_summarization: ""   # conversation summarization
  text_utility: ""         # proactive decision, image prompt, card translation
  # video: ""   # post-MVP
  # audio: ""   # post-MVP

user:
  # Display name for the user in chat (used for {{user}} macro)
  name: "User"

# Chat / AI quality settings
chat:
  # Total context window of the text model in tokens: the prompt AND the
  # generated reply share it (prompt + reply <= context_window).  This is a
  # fallback -- when the active text connector declares its own
  # context_window / max_tokens, those win.
  context_window: 4096
  # Trigger conversation summarization when this fraction of the room left for
  # the prompt (context_window minus the connector's max_tokens) is used.
  summarization_threshold: 0.75
  # Inject a guardrail when out-of-character jailbreak attempts are detected.
  ooc_protection: true
  # Let the character send an image on its own initiative (not only when the
  # user asks for one). Requires an active image connector.
  image_autonomy: true
  # Assistant replies that must pass without any image before the character may
  # send another one on its own. 0 disables the guard.
  image_autonomy_cooldown: 4

# Background media-cleanup scheduler (default: disabled)
scheduler:
  enabled: false
  # How often to run cleanup (seconds). Default: 24 hours.
  interval_seconds: 86400
  # Delete images older than this many days.
  cleanup_older_than_days: 30
  # Periodically test the active connectors so /api/health reports live state.
  health_check_enabled: true
  # How often to test the active connectors (seconds). Default: 5 minutes.
  health_check_interval_seconds: 300

# Operational observability (Admin → Operations is always available)
observability:
  # Expose Prometheus metrics at /metrics. Unauthenticated — keep it on a
  # private network. Disabled by default.
  metrics_enabled: false

# GUI customization (also editable in Admin → Customization)
gui:
  # Arbitrary CSS injected into every page.
  custom_css: ""
  # Raw HTML inserted just after the opening <header> tag.
  custom_header_html: ""
  # Raw HTML inserted just before the closing </footer> tag.
  custom_footer_html: ""
  # When false, the public character list is empty: chats are unlisted and only
  # reachable through a direct /?character=<id> URL or via Telegram.
  public_character_list: true

