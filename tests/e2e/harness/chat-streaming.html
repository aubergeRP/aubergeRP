<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Streaming Harness</title>
  <link rel="stylesheet" href="../../../frontend/css/main.css">
</head>
<body>
  <section id="message-list" aria-label="Messages"></section>
  <div id="input-area" style="display:none">
    <div id="input-actions">
      <button id="generate-image-btn" style="display:none" aria-label="Generate a picture of the scene">🖼</button>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script type="module">
    import { __test } from '../../../frontend/js/chat.js';

    window.__chatHarness = {
      startImage(prompt = 'a moonlit tavern') {
        const streaming = __test.createStreamingMessage();
        streaming.onImageStart('gen-1', prompt);
        window.__streaming = streaming;
      },
      progressImage(step = 2, total = 5) {
        window.__streaming?.onImageProgress('gen-1', step, total);
      },
      completeImage(url = 'https://example.test/image.png') {
        window.__streaming?.onImageComplete('gen-1', url);
      },
      failImage(detail = 'Generation failed') {
        window.__streaming?.onImageFailed('gen-1', detail);
      },
      finalize() {
        window.__streaming?.finalize();
      },
      // Proactive web push: a typing status arrives before any content.
      startTyping() {
        window.__streaming = __test.createStreamingMessage();
      },
      cancelTyping() {
        window.__streaming?.cancel();
      },
      typeToken(text = 'Hello') {
        window.__streaming?.onToken(text);
      },
      dispatchProgressEvent() {
        const streaming = __test.createStreamingMessage();
        __test.dispatchSSEEvent({ type: 'image_start', generation_id: 'gen-2', prompt: 'stormy castle' }, streaming);
        __test.dispatchSSEEvent({ type: 'image_progress', generation_id: 'gen-2', step: 1, total: 4 }, streaming);
        window.__streaming = streaming;
      },
      // Simulate failure without a prior image_start (e.g. placeholder missing)
      failImageOrphan(genId = 'gen-orphan', detail = 'Generation failed') {
        const streaming = __test.createStreamingMessage();
        window.__streaming = streaming;
        streaming.onImageFailed(genId, detail);
      },
      // Simulate full retry cycle: start → fail (to produce errEl with retry btn)
      startAndFailImage(prompt = 'a tavern', detail = 'HTTP 400') {
        const streaming = __test.createStreamingMessage();
        streaming.onImageStart('gen-retry', prompt);
        window.__streaming = streaming;
        streaming.onImageFailed('gen-retry', detail);
      },
      // Image connector status helpers
      setImageConnector(hasConnector) {
        __test.updateImageConnectorStatus(hasConnector);
      },
      getHasImageConnector() {
        return __test.getHasImageConnector();
      },
    };
  </script>
</body>
</html>
